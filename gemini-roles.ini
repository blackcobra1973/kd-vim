# This is an example, do not modify/use this file!!!
# Instead, configure location of your own role file:
# - let g:vim_ai_roles_config_file = '/path/to/my/roles.ini'

# .ini file structure: https://docs.python.org/3/library/configparser.html#supported-ini-file-structure

# default role is always defined even though empty
[default]
provider = google
options.token_file_path = ~/.config/gemini.token

[gemini]
provider = google
# default fields
options.model = gemini-2.5-flash
options.endpoint_url = https://generativelanguage.googleapis.com/v1beta/models
options.request_timeout = 20
# optional fields
options.token_file_path = ~/.config/gemini.token
options.token_load_fn =
options.temperature = 1.0
options.max_output_tokens = 800
options.top_p = 0.8
options.top_k = 10
[gemini.chat]
options.model = gemini-2.5-flash
[gemini.complete]
options.model = gemini-2.5-pro
[gemini.edit]
options.model = gemini-2.5-pro

